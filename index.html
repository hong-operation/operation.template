<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>홍카페 섭외 템플릿</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
:root{
 --bg:#f4f4f2;--rail:#eaeae7;--card:#ffffff;--ink:#1e1e22;--sub:#6b6b73;--line:#dcdcd8;
 --ac:#26262b;--acw:#ffffff;--acs:#ececea;--hi:#ffd9b0;--bub:#fff4c2;--bubl:#f0de8f;--red:#c8372d;
 --sans:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
 --serif:"Noto Serif KR","Batang",serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
 --bg:#141416;--rail:#1a1a1d;--card:#202024;--ink:#ececf0;--sub:#a0a0aa;--line:#303036;
 --ac:#ececf0;--acw:#141416;--acs:#2a2a2f;--hi:#6a4a2a;--bub:#3a3420;--bubl:#5a5030;--red:#ff8a7a}}
:root[data-theme="dark"]{
 --bg:#141416;--rail:#1a1a1d;--card:#202024;--ink:#ececf0;--sub:#a0a0aa;--line:#303036;
 --ac:#ececf0;--acw:#141416;--acs:#2a2a2f;--hi:#6a4a2a;--bub:#3a3420;--bubl:#5a5030;--red:#ff8a7a}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

.app{display:grid;grid-template-columns:250px 1fr;height:100%}
.brand{font:700 19px var(--serif);margin:2px 8px 18px}
.search{width:300px;max-width:100%;position:relative}
.search input{width:100%;padding:9px 36px 9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--sub);padding:4px 8px;display:none}
.search.has button{display:block}
.rail{background:var(--rail);border-right:1px solid var(--line);padding:16px 12px;overflow:auto}
.rail .cap{font-size:12px;color:var(--sub);margin:2px 8px 8px}
.sec{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px}
.sec:hover{background:var(--card)}
.sec.on{background:var(--ac);color:var(--acw);font-weight:700}
.sec .c{font-size:12px;opacity:.75}
.addsec{margin-top:10px;width:100%;border:1px dashed var(--sub);background:none;border-radius:10px;padding:9px;color:var(--sub)}
.addsec:hover{color:var(--ac);border-color:var(--ac)}
.addrow{display:flex;gap:6px;margin-top:10px}
.addrow .addsec{flex:1;margin:0}
.arrow{width:40px;border:1px solid var(--line);background:var(--card);border-radius:10px;color:var(--sub)}
.arrow:hover{border-color:var(--ac);color:var(--ac)}
.main{padding:32px 40px 60px;overflow:auto}
.inner{max-width:820px;margin:0 auto}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;margin-bottom:24px}
.sechead{display:flex;align-items:center;gap:10px;flex:1;min-width:200px}
.sechead h2{font:700 26px var(--serif);margin:0;margin-right:6px}
.g{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:5px 11px;font-size:13px}
.g:hover{border-color:var(--ac);color:var(--ac)}
.g.red:hover{border-color:var(--red);color:var(--red)}
.pick{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.pick select{flex:1;min-width:220px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);font-weight:500}
.btn{border:1px solid var(--ac);background:var(--ac);color:var(--acw);border-radius:10px;padding:10px 18px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn.line{background:var(--card);color:var(--ink);border-color:var(--line);font-weight:500}
.btn.line:hover{border-color:var(--ac);color:var(--ac)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{filter:none;border-color:var(--line);color:var(--ink)}

.tpl h3{font:700 20px var(--serif);margin:0 0 12px}
.bubble{position:relative;background:var(--bub);border:1px solid var(--bubl);border-radius:4px 18px 18px 18px;padding:18px 20px;white-space:pre-wrap;line-height:1.85;word-break:keep-all;overflow-wrap:anywhere}
.bubble.ed{cursor:text}
.bubble.ed:hover{border-color:var(--ac)}
.inl{display:block;width:100%;min-height:240px;resize:vertical;font:inherit;line-height:1.85;color:var(--ink);background:var(--bub);border:2px solid var(--ac);border-radius:4px 18px 18px 18px;padding:17px 19px}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.meta .n{margin-left:auto;font-size:13px;color:var(--sub)}
.empty{padding:40px 0;color:var(--sub)}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:16px}

.res{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
.res:hover{border-color:var(--ac)}
.res .p{font-size:12px;color:var(--ac);font-weight:700}
.res .t{font-weight:700;margin:2px 0}
.res .s{font-size:13px;color:var(--sub);white-space:pre-wrap}
mark{background:var(--hi);color:inherit;border-radius:3px;padding:0 1px}
.rh{font:700 18px var(--serif);margin:0 0 14px}

.ov{position:fixed;inset:0;background:rgba(10,14,20,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:5}
.ov.show{display:flex}
.modal{background:var(--card);border-radius:16px;padding:22px;width:100%;max-width:580px;max-height:92vh;overflow:auto}
.modal h3{font:700 19px var(--serif);margin:0 0 6px}
.modal label{display:block;font-size:13px;color:var(--sub);margin:14px 0 5px}
.modal input,.modal textarea,.modal select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.modal textarea{min-height:240px;resize:vertical;line-height:1.7}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal p{margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:9}
.toast.show{opacity:1}
.foot{margin-top:40px;padding-top:14px;border-top:1px solid var(--line);font-size:13px}
.foot button{background:none;border:0;color:var(--sub);text-decoration:underline;padding:0}
.gbtn{margin-top:12px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:14px}
.glabel{font-weight:700;font-size:15px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.gline{margin:0;line-height:1.7}
.gnote{position:relative;padding-left:1.2em;font-size:13px;line-height:1.7;color:var(--sub);margin:6px 0 0}
.gnote:before{content:'※';position:absolute;left:0}
.steps{list-style:none;margin:0;padding:0}
.gstep{position:relative;display:flex;gap:12px;padding-bottom:18px}
.gstep:last-child{padding-bottom:0}
.gstep:before{content:'';position:absolute;left:11px;top:28px;bottom:2px;width:1px;background:var(--line)}
.gstep:last-child:before{display:none}
.snum{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--ac);color:var(--acw);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sbody{flex:1;min-width:0}
.stitle{font-weight:700;line-height:24px}
.demo{display:inline-block;padding:1px 12px;border-radius:8px;font-size:13px;font-weight:700;line-height:1.6}
.demo.dark{background:var(--ac);color:var(--acw)}
.demo.line{border:1px solid var(--line);font-weight:500;background:var(--bg)}
.callout{background:color-mix(in srgb,var(--red) 10%,var(--card));border:1px solid color-mix(in srgb,var(--red) 35%,var(--card));border-radius:8px;padding:12px 14px;line-height:1.7;color:var(--red);margin-bottom:12px}
.glist{list-style:none;margin:0;padding:0}
.glist li{position:relative;padding-left:1em;font-size:13px;line-height:1.7;color:var(--sub);margin-top:6px}
.glist li:before{content:'·';position:absolute;left:0;font-weight:700}

@media(max-width:700px){
 .app{grid-template-columns:1fr;height:auto;min-height:100%}
 .brand{display:none}
 .search{width:100%}
 .addrow{margin:0}
 .gbtn{margin-top:0}
 .rail{border-right:0;border-bottom:1px solid var(--line);padding:10px 12px;display:flex;gap:6px;overflow-x:auto;align-items:center}
 .rail .cap{display:none}
 .sec{width:auto;white-space:nowrap;gap:6px;background:var(--card)}
 .addsec{margin:0;width:auto;white-space:nowrap}
 .main{padding:20px 16px 60px;overflow:visible}
 .sechead h2{font-size:22px}
}
</style>
</head>
<body>

 <nav class="rail" id="rail"></nav>
 <main class="main"><div class="inner">
  <div class="bar"><div class="sechead" id="title"></div>
   <div class="search" id="sbox"><input id="q" type="search" placeholder="제목이나 내용으로 검색" autocomplete="off"><button id="qx" aria-label="검색어 지우기">✕</button></div></div>
  <div id="main"></div>
 </div></main>
</div>
<div class="ov" id="ov"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>
var KEY="hongcafe_templates_v3";
var D={sections:[]},sel={s:null,i:null},q="",mode="loading",dbDoc=null,W=true,seeded=false,editId=null,draft="",view="tpl";

  if(!curSec()&&D.sections.length){sel.s=D.sections[0].id;sel.i=null}
  var s=curSec();
  if(s&&!curItem())sel.i=s.items.length?s.items[0].id:null;
  var r="<div class='brand'>홍카페 섭외 템플릿</div><div class='cap'>섹션</div>";
  D.sections.forEach(function(x){
    r+="<button class='sec"+(x.id===sel.s&&!q&&view!=="guide"?" on":"")+"' data-sec='"+x.id+"'><span>"+esc(x.name)+"</span><span class='c'>"+x.items.length+"</span></button>";
  });
  if(W)r+="<div class='addrow'><button class='addsec' id='addSec'>＋ 섹션 추가</button><button class='arrow' data-m='-1' aria-label='선택한 섹션을 위로 이동' title='선택한 섹션을 위로'>▲</button><button class='arrow' data-m='1' aria-label='선택한 섹션을 아래로 이동' title='선택한 섹션을 아래로'>▼</button></div>";
  r+="<button class='sec gbtn"+(view==="guide"&&!q?" on":"")+"' data-guide='1'><span>사용 가이드</span></button>";
  $("rail").innerHTML=r;
  var t="";
  if(mode!=="loading"){
    if(q)t="<h2>전체 검색</h2>";
    else if(view==="guide")t="<h2>사용 가이드</h2>";
    else if(s)t="<h2>"+esc(s.name)+"</h2>"+(W?"<button class='g' data-a='secEdit'>섹션명 수정</button><button class='g red' data-a='secDel'>삭제</button>":"");
  }
  $("title").innerHTML=t;
  $("main").innerHTML=mode==="loading"?"<div class='empty'><b>불러오는 중이에요</b>잠시만 기다려주세요.</div>":(q?renderSearch():view==="guide"?renderGuide():renderMain(s));
}

function renderSearch(){
  var term=q.toLowerCase(),out=[];
  D.sections.forEach(function(s){s.items.forEach(function(i){
    var inT=i.title.toLowerCase().indexOf(term)>=0,pos=i.body.toLowerCase().indexOf(term);
    if(inT||pos>=0)out.push({s:s,i:i,pos:pos});
  })});
  var h="<h2 class='rh'>“"+esc(q)+"” 검색 결과 "+out.length+"건</h2>";
  if(!out.length)return h+"<div class='empty'><b>찾는 템플릿이 없어요</b>다른 단어로 검색해보세요.</div>";
  out.forEach(function(o){
    var sn="";
    if(o.pos>=0){var a=Math.max(0,o.pos-30);sn=(a>0?"…":"")+o.i.body.substr(a,110)+(a+110<o.i.body.length?"…":"")}
    else sn=o.i.body.substr(0,80)+(o.i.body.length>80?"…":"");
    h+="<button class='res' data-s='"+o.s.id+"' data-i='"+o.i.id+"'><div class='p'>"+esc(o.s.name)+"</div><div class='t'>"+hl(o.i.title,q)+"</div><div class='s'>"+hl(sn,q)+"</div></button>";
  });
  return h;
}

function renderMain(s){
  if(!s)return "<div class='empty'><b>아직 섹션이 없어요</b>왼쪽의 “섹션 추가”로 첫 섹션을 만들어보세요.</div>";
  var h="<div class='pick'>";
  if(s.items.length)h+="<select id='pick' aria-label='템플릿 선택'>"+s.items.map(function(i){return"<option value='"+i.id+"'"+(i.id===sel.i?" selected":"")+">"+esc(i.title)+"</option>"}).join("")+"</select>";
  if(W)h+="<button class='btn' data-a='itemAdd'>＋ 템플릿 추가</button>";
  h+="</div>";
  var it=curItem();
  if(it){
    var ed=W&&editId===it.id;
    h+="<div class='tpl'><h3>"+esc(it.title)+"</h3>"+
     (ed?"<textarea class='inl' id='inl' aria-label='템플릿 내용 수정'>"+esc(draft)+"</textarea>":"<div class='bubble"+(W?" ed":"")+"' data-a='inline'"+(W?" title='클릭해서 바로 수정'":"")+">"+esc(it.body)+"</div>")+
     "<div class='meta'>"+
     (ed?"<button class='btn' data-a='inlSave'>저장</button><button class='btn line' data-a='inlCancel'>취소</button><span class='n'>Ctrl+Enter 저장, Esc 취소</span>":
      "<button class='btn' data-a='copy'>내용 복사</button>"+(W?"<button class='btn line' data-a='itemEdit'>수정</button><button class='btn line' data-a='itemDel'>삭제</button>":"")+(W&&defItem(it.id)?"<button class='btn line' data-a='itemReset'"+(modified(it)?"":" disabled title='아직 수정하지 않은 기본 상태예요'")+">기본으로 되돌리기</button>":"")+"<span class='n'>"+it.body.length+"자"+(W?", 노란 칸을 누르면 바로 수정돼요":"")+"</span>")+
     "</div></div>";
  }else h+="<div class='empty'><b>이 섹션에는 템플릿이 없어요</b>“템플릿 추가”를 눌러 첫 템플릿을 만들어보세요.</div>";
  h+="<div class='foot'>"+(W?"<button data-a='backup'>백업 / 불러오기</button><button data-a='resetAll' style='margin-left:12px'>기본값으로 전체 초기화</button>":"")+"<span style='color:var(--sub);margin-left:"+(W?"12":"0")+"px'>"+(!W?"보기 전용이에요":mode==="local"?"이 브라우저에만 저장돼요":"수정하면 함께 보는 모든 사람에게 바로 반영돼요")+"</span></div>";
  return h;
}

function gstep(n,t,notes){return "<li class='gstep'><span class='snum'>"+n+"</span><div class='sbody'><div class='stitle'>"+t+"</div>"+(notes||[]).map(function(x){return "<p class='gnote'>"+x+"</p>"}).join("")+"</div></li>"}
function renderGuide(){
  return "<div class='gcard'><div class='glabel'>1. 템플릿 사용 방법</div>"+
   "<p class='gline'>왼쪽에서 <strong>섹션</strong>을 고르고, 위쪽 <strong>드롭박스</strong>에서 세부 항목을 선택하면 템플릿이 나옵니다.</p>"+
   "<p class='gnote'>찾는 문구가 있으면 오른쪽 위 <strong>검색창</strong>에 단어를 입력하세요. 모든 섹션에서 한 번에 찾아줍니다.</p>"+
   "<p class='gnote'>기본 템플릿이 제공되며, 내 스타일대로 고쳐 써도 다른 담당자 화면에는 영향이 없습니다.</p></div>"+
  "<div class='gcard'><div class='glabel'>2. 템플릿 보내는 순서</div><ol class='steps'>"+
   gstep(1,"섹션 선택",["왼쪽 목록에서 섭외 종류를 고릅니다."])+
   gstep(2,"세부 항목 선택",["드롭박스에서 상황에 맞는 템플릿을 고릅니다."])+
   gstep(3,"내용 확인",["노란 칸에서 문구를 확인하고, 상대에 맞게 바꿀 부분은 보내기 전에 수정해 주세요."])+
   gstep(4,"<span class='demo dark'>내용 복사</span>",["복사한 문구를 카카오 오픈 채팅, 이메일 등에 붙여넣어 보냅니다."])+
  "</ol></div>"+
  "<div class='gcard'><div class='glabel'>3. 내 스타일로 고치기</div><ol class='steps'>"+
   gstep(1,"문구 바로 수정",["노란 칸을 클릭하면 그 자리에서 고칠 수 있고, <strong>저장</strong>(Ctrl+Enter)을 눌러야 반영됩니다. 취소는 Esc입니다."])+
   gstep(2,"제목·섹션 관리",["<strong>수정</strong>·<strong>삭제</strong> 버튼으로 템플릿 제목을 바꾸거나 다른 섹션으로 옮기고, <strong>＋ 템플릿 추가</strong>로 새 템플릿을 만듭니다.","섹션은 왼쪽의 <strong>＋ 섹션 추가</strong>, 섹션 제목 옆의 <strong>섹션명 수정</strong>, ▲▼ 버튼으로 관리합니다."])+
   gstep(3,"<span class='demo line'>기본으로 되돌리기</span>",["수정한 템플릿은 이 버튼으로 처음 제공된 문구로 되돌릴 수 있습니다."])+
  "</ol></div>"+
  "<div class='gcard'><div class='glabel'>참고사항</div>"+
   "<div class='callout'>수정한 내용은 <strong>이 PC의 이 브라우저에만 저장</strong>됩니다. 다른 PC·다른 브라우저의 담당자와는 공유되지 않아요.</div>"+
   "<ul class='glist'><li>시크릿 모드에서는 창을 닫으면 수정 내용이 사라집니다.</li><li>브라우저 데이터를 지우거나 접속 주소가 바뀌기 전에는 템플릿 화면 아래의 <strong>백업 / 불러오기</strong>로 백업해 주세요.</li><li><strong>기본값으로 전체 초기화</strong>를 누르면 삭제한 기본 템플릿도 되살아나지만, 직접 수정·추가한 내용은 모두 사라집니다.</li><li>기본 템플릿이 나중에 새로 바뀌어도, 이미 수정해 쓰고 있는 브라우저에는 자동으로 반영되지 않습니다.</li></ul></div>";
}
function modal(html,onOk,label,danger){
  $("modal").innerHTML=html+"<div class='acts'><button class='btn line' id='mc'>취소</button>"+(onOk?"<button class='btn"+(danger?" danger":"")+"' id='mo'>"+(label||"저장")+"</button>":"")+"</div>";
  $("ov").classList.add("show");
  $("mc").onclick=closeModal;
  if(onOk)$("mo").onclick=onOk;
  var f=$("f1");if(f)f.focus();
}
function closeModal(){$("ov").classList.remove("show")}
function v(id){return $(id).value}
function after(){save();closeModal();render()}

function secForm(sec){
  modal("<h3>"+(sec?"섹션명 수정":"새 섹션 추가")+"</h3><label>섹션명</label><input id='f1' value='"+(sec?esc(sec.name):"")+"'>",function(){
    var n=v("f1").trim();if(!n){toast("섹션명을 입력해주세요");return}
    if(sec)sec.name=n;else{var ns={id:uid(),name:n,items:[]};D.sections.push(ns);view="tpl";sel.s=ns.id;sel.i=null;q="";$("q").value="";$("sbox").classList.remove("has")}
    after();
  });
}
function itemForm(it){
  var cur=curSec();
  var opts=D.sections.map(function(s){return"<option value='"+s.id+"'"+(s.id===cur.id?" selected":"")+">"+esc(s.name)+"</option>"}).join("");
  modal("<h3>"+(it?"템플릿 수정":"새 템플릿 추가")+"</h3><label>제목 (드롭박스에 표시돼요)</label><input id='f1' value='"+(it?esc(it.title):"")+"'>"+
   "<label>섹션 (바꾸면 다른 섹션으로 이동해요)</label><select id='f3'>"+opts+"</select>"+
   "<label>내용</label><textarea id='f2'>"+(it?esc(it.body):"")+"</textarea>",function(){
    var t=v("f1").trim(),b=v("f2"),target=D.sections.filter(function(s){return s.id===v("f3")})[0];
    if(!t){toast("제목을 입력해주세요");return}
    if(it){
      it.title=t;it.body=b;
      if(target.id!==cur.id){cur.items=cur.items.filter(function(x){return x.id!==it.id});target.items.push(it);sel.s=target.id;sel.i=it.id}
    }else{var ni={id:uid(),title:t,body:b};target.items.push(ni);sel.s=target.id;sel.i=ni.id}
    after();
  });
}
function confirmDel(msg,fn){modal("<h3>삭제할까요?</h3><p>"+esc(msg)+"</p>",function(){fn();after()},"삭제",true)}
function saveInline(){var it=curItem();if(!it||editId!==it.id)return;var t=$("inl");it.body=t?t.value:draft;editId=null;save();render();toast("저장했어요")}
function copyText(t){
  function fb(){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("복사했어요")}catch(e){toast("복사에 실패했어요")}document.body.removeChild(a)}
  try{navigator.clipboard.writeText(t).then(function(){toast("복사했어요")},fb)}catch(e){fb()}
}
function saveFile(){
  var d=new Date(),n="홍카페_템플릿_백업_"+d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2)+".txt";
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:"text/plain;charset=utf-8"}));
  a.download=n;document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href)},1500);
  toast("백업 파일을 저장했어요 (다운로드 폴더)");
}
function backup(){
  var pv=window.self!==window.top;
  modal("<h3>백업 / 불러오기</h3>"+
   "<p style='font-size:13px;color:var(--sub)'>“파일로 저장”을 누르면 백업 파일이 내려받아져요. 복원할 때는 “파일에서 불러오기”로 그 파일을 고른 뒤 “불러오기”를 누르세요. 아래 글자를 복사·붙여넣는 방식도 쓸 수 있어요. 불러오면 지금 내용은 덮어써져요.</p>"+
   (pv?"<p style='font-size:13px;color:var(--red)'>※ 지금 화면(미리보기)에서는 파일 저장·불러오기가 동작하지 않아요. 글자 복사·붙여넣기를 이용해 주세요.</p>":"")+
   "<div style='display:flex;gap:8px;flex-wrap:wrap;margin:12px 0'><button class='btn line' id='bkSave'>파일로 저장</button><button class='btn line' id='bkLoad'>파일에서 불러오기</button><button class='btn line' id='bkCopy'>글자 복사</button></div>"+
   "<input type='file' id='bkFile' accept='.txt,.json' style='display:none'>"+
   "<textarea id='f2' style='min-height:200px;font-size:12px'>"+esc(JSON.stringify(D))+"</textarea>",function(){
    try{var d=JSON.parse(v("f2"));if(!d.sections)throw 1;D=d;sel.s=null;sel.i=null;after();toast("불러왔어요")}catch(e){toast("형식이 올바르지 않아요")}
  },"불러오기");
  $("bkSave").onclick=saveFile;
  $("bkCopy").onclick=function(){copyText(v("f2"))};
  $("bkLoad").onclick=function(){$("bkFile").click()};
  $("bkFile").onchange=function(){
    var f=this.files&&this.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){$("f2").value=r.result;toast("파일을 읽었어요. “불러오기”를 눌러 적용하세요")};
    r.onerror=function(){toast("파일을 읽지 못했어요")};
    r.readAsText(f,"utf-8");
  };
}

$("rail").onclick=function(e){
  if(e.target.closest("#addSec")){secForm(null);return}
  var ar=e.target.closest(".arrow");
  if(ar){var s0=curSec();if(s0&&swap(D.sections,D.sections.indexOf(s0),+ar.getAttribute("data-m"))){save();render()}return}
  var b=e.target.closest(".sec");if(!b)return;
  if(b.getAttribute("data-guide")){view="guide";q="";$("q").value="";$("sbox").classList.remove("has");render();return}
  view="tpl";sel.s=b.getAttribute("data-sec");sel.i=null;q="";$("q").value="";$("sbox").classList.remove("has");render();
};
$("title").onclick=$("main").onclick=function(e){
  var r=e.target.closest(".res");
  if(r){view="tpl";sel.s=r.getAttribute("data-s");sel.i=r.getAttribute("data-i");q="";$("q").value="";$("sbox").classList.remove("has");render();return}
  var b=e.target.closest("[data-a]");if(!b)return;
  var a=b.getAttribute("data-a"),s=curSec(),it=curItem();
  if(a==="secEdit")secForm(s);
  else if(a==="secDel")confirmDel("“"+s.name+"” 섹션과 안의 템플릿 "+s.items.length+"개가 모두 삭제돼요.",function(){D.sections=D.sections.filter(function(x){return x.id!==s.id});sel.s=null;sel.i=null});
  else if(a==="itemAdd")itemForm(null);
  else if(a==="itemEdit")itemForm(it);
  else if(a==="itemDel")confirmDel("“"+it.title+"” 템플릿이 삭제돼요.",function(){s.items=s.items.filter(function(x){return x.id!==it.id});sel.i=null});
  else if(a==="copy")copyText(it.body);
  else if(a==="inline"){if(W&&it&&!String(window.getSelection())){editId=it.id;draft=it.body;render();var tx=$("inl");if(tx){tx.focus();tx.setSelectionRange(tx.value.length,tx.value.length)}}}
  else if(a==="inlSave")saveInline();
  else if(a==="inlCancel"){editId=null;render()}
  else if(a==="itemReset")modal("<h3>기본으로 되돌릴까요?</h3><p>“"+esc(it.title)+"” 템플릿을 처음 제공된 문구로 되돌려요. 직접 수정한 내용은 사라집니다.</p>",function(){var dd=defItem(it.id);it.title=dd.title;it.body=dd.body;after()},"되돌리기")
  else if(a==="resetAll")modal("<h3>기본값으로 전체 초기화</h3><p>모든 섹션과 템플릿이 처음 제공된 기본 상태로 돌아가고, 직접 수정·추가한 내용은 모두 사라져요. 필요하면 만저 백업해 주세요.</p>",function(){D=DEF();sel.s=null;sel.i=null;editId=null;after()},"초기화",true)
  else if(a==="backup")backup();
};
$("main").onchange=function(e){if(e.target.id==="pick"){sel.i=e.target.value;render()}};
$("q").oninput=function(){q=this.value.trim();$("sbox").classList.toggle("has",!!this.value);render()};
$("qx").onclick=function(){$("q").value="";q="";$("sbox").classList.remove("has");render();$("q").focus()};
$("main").addEventListener("input",function(e){if(e.target.id==="inl")draft=e.target.value});
document.addEventListener("keydown",function(e){
  var open=$("ov").classList.contains("show");
  if(e.key==="Escape"){if(open)closeModal();else if(editId){editId=null;render()}}
  else if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)&&editId&&!open)saveInline();
});
$("ov").onclick=function(e){if(e.target===this)closeModal()};
D=local()||DEF();mode="local";
try{if(!localStorage.getItem(KEY+"_seen")){view="guide";localStorage.setItem(KEY+"_seen","1")}}catch(e){}
render();
</script>
</body>
</html>
